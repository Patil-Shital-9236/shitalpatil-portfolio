<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;family=Alex+Brush&amp;display=swap');
      .cursa-bg { fill: #ffffff; }
      .cursa-purple-dots { fill: #d8d0ed; }
      .cursa-green-text { fill: #0d5f47; font-family: 'Montserrat', sans-serif; }
      .cursa-main-title { fill: #0d5f47; font-family: 'Montserrat', sans-serif; font-weight: 700; }
      .cursa-dark-text { fill: #1f2937; font-family: 'Montserrat', sans-serif; }
      .cursa-muted-text { fill: #4b5563; font-family: 'Montserrat', sans-serif; }
      .cursa-script { font-family: 'Alex Brush', cursive; fill: #111827; }
    </style>

    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8e0d0" />
      <stop offset="100%" stop-color="#46a085" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" class="cursa-bg" rx="16" />
  <rect width="1190" height="840" x="5" y="5" fill="none" stroke="#e5e7eb" stroke-width="2" rx="14" />

  <!-- Left Purple Polka Pattern -->
  <g class="cursa-purple-dots" opacity="0.75">
    <path d="M 0 0 C 180 0, 240 80, 240 240 C 240 400, 180 500, 240 640 C 300 780, 150 850, 0 850 Z" fill="#eee8f8" />
    <!-- Grid Dots -->
    <g fill="#c9bee6">
      <rect x="20" y="30" width="18" height="18" rx="6"/> <rect x="50" y="30" width="18" height="18" rx="6"/> <rect x="80" y="30" width="18" height="18" rx="6"/> <rect x="110" y="30" width="18" height="18" rx="6"/> <rect x="140" y="30" width="18" height="18" rx="6"/> <rect x="170" y="30" width="18" height="18" rx="6"/>
      <rect x="20" y="60" width="18" height="18" rx="6"/> <rect x="50" y="60" width="18" height="18" rx="6"/> <rect x="80" y="60" width="18" height="18" rx="6"/> <rect x="110" y="60" width="18" height="18" rx="6"/> <rect x="140" y="60" width="18" height="18" rx="6"/> <rect x="170" y="60" width="18" height="18" rx="6"/>
      <rect x="20" y="90" width="18" height="18" rx="6"/> <rect x="50" y="90" width="18" height="18" rx="6"/> <rect x="80" y="90" width="18" height="18" rx="6"/> <rect x="110" y="90" width="18" height="18" rx="6"/> <rect x="140" y="90" width="18" height="18" rx="6"/> <rect x="170" y="90" width="18" height="18" rx="6"/>
      <rect x="20" y="120" width="18" height="18" rx="6"/> <rect x="50" y="120" width="18" height="18" rx="6"/> <rect x="80" y="120" width="18" height="18" rx="6"/> <rect x="110" y="120" width="18" height="18" rx="6"/> <rect x="140" y="120" width="18" height="18" rx="6"/>
      <rect x="20" y="150" width="18" height="18" rx="6"/> <rect x="50" y="150" width="18" height="18" rx="6"/> <rect x="80" y="150" width="18" height="18" rx="6"/> <rect x="110" y="150" width="18" height="18" rx="6"/>
      <rect x="20" y="180" width="18" height="18" rx="6"/> <rect x="50" y="180" width="18" height="18" rx="6"/> <rect x="80" y="180" width="18" height="18" rx="6"/>
      <rect x="20" y="210" width="18" height="18" rx="6"/> <rect x="50" y="210" width="18" height="18" rx="6"/>
      <rect x="20" y="240" width="18" height="18" rx="6"/>
      <!-- Lower Dots -->
      <rect x="20" y="550" width="18" height="18" rx="6"/> <rect x="50" y="550" width="18" height="18" rx="6"/> <rect x="80" y="550" width="18" height="18" rx="6"/>
      <rect x="20" y="580" width="18" height="18" rx="6"/> <rect x="50" y="580" width="18" height="18" rx="6"/> <rect x="80" y="580" width="18" height="18" rx="6"/> <rect x="110" y="580" width="18" height="18" rx="6"/>
      <rect x="20" y="610" width="18" height="18" rx="6"/> <rect x="50" y="610" width="18" height="18" rx="6"/> <rect x="80" y="610" width="18" height="18" rx="6"/> <rect x="110" y="610" width="18" height="18" rx="6"/> <rect x="140" y="610" width="18" height="18" rx="6"/>
      <rect x="20" y="640" width="18" height="18" rx="6"/> <rect x="50" y="640" width="18" height="18" rx="6"/> <rect x="80" y="640" width="18" height="18" rx="6"/> <rect x="110" y="640" width="18" height="18" rx="6"/> <rect x="140" y="640" width="18" height="18" rx="6"/> <rect x="170" y="640" width="18" height="18" rx="6"/>
      <rect x="20" y="670" width="18" height="18" rx="6"/> <rect x="50" y="670" width="18" height="18" rx="6"/> <rect x="80" y="670" width="18" height="18" rx="6"/> <rect x="110" y="670" width="18" height="18" rx="6"/> <rect x="140" y="670" width="18" height="18" rx="6"/> <rect x="170" y="670" width="18" height="18" rx="6"/>
    </g>
  </g>

  <!-- Top Ribbon Star Seal -->
  <g transform="translate(240, 25)">
    <polygon points="40,110 20,170 50,145 80,170 60,110" fill="#a8e0d0" opacity="0.8" />
    <polygon points="60,110 40,170 70,145 100,170 80,110" fill="#75cbb3" opacity="0.9" />
    <circle cx="60" cy="65" r="55" fill="url(#sealGrad)" />
    <circle cx="60" cy="65" r="45" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4" />
  </g>

  <!-- Top Right Cursa Logo -->
  <g transform="translate(960, 60)">
    <rect width="52" height="52" rx="14" fill="#0d5f47" />
    <!-- Mortarboard Icon -->
    <path d="M 26 15 L 42 23 L 26 31 L 10 23 Z" fill="#ffffff" />
    <path d="M 16 27 L 16 35 C 16 39, 36 39, 36 35 L 36 27" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <text x="65" y="37" font-family="'Montserrat', sans-serif" font-weight="800" font-size="34" fill="#111827" letter-spacing="-1">cursa</text>
  </g>

  <!-- Header Title -->
  <text x="250" y="125" font-family="'Montserrat', sans-serif" font-weight="800" font-size="54" class="cursa-green-text" letter-spacing="2">CERTIFICATE</text>
  <text x="350" y="172" font-family="'Alex Brush', cursive" font-size="52" fill="#111827">of completion</text>

  <!-- Student Line -->
  <text x="250" y="222" font-family="'Montserrat', sans-serif" font-weight="700" font-size="19" class="cursa-dark-text">We certify that the student:</text>
  <text x="250" y="280" font-family="'Montserrat', sans-serif" font-weight="800" font-size="44" fill="#111827">Shital Deepak Patil</text>
  <text x="250" y="320" font-family="'Montserrat', sans-serif" font-weight="500" font-size="18" class="cursa-muted-text">completed the following course on our e-learning platform:</text>

  <!-- Course Title -->
  <text x="250" y="415" font-family="'Montserrat', sans-serif" font-weight="800" font-size="42" class="cursa-main-title">Graphic design for Beginners</text>

  <!-- Workload & Date -->
  <text x="250" y="475" font-family="'Montserrat', sans-serif" font-weight="600" font-size="22" class="cursa-dark-text">With a workload of 11 hours 12 minutes</text>
  <text x="250" y="515" font-family="'Montserrat', sans-serif" font-weight="600" font-size="22" class="cursa-dark-text">Completed on August 31, 2026</text>

  <!-- Signatures Footer -->
  <g transform="translate(300, 700)">
    <path d="M 0 0 Q 30 -25, 70 0 T 140 -10 T 200 -5" fill="none" stroke="#1f2937" stroke-width="2.5" />
    <line x1="0" y1="12" x2="240" y2="12" stroke="#9ca3af" stroke-width="1.5" />
    <text x="0" y="32" font-family="'Montserrat', sans-serif" font-weight="600" font-size="12" fill="#4b5563">Adrian Dantas - Executive Director - Cursa</text>
  </g>

  <g transform="translate(600, 700)">
    <text x="0" y="-8" font-family="'Alex Brush', cursive" font-size="34" fill="#1f2937">Shital Deepak Patil</text>
    <line x1="0" y1="12" x2="220" y2="12" stroke="#9ca3af" stroke-width="1.5" />
    <text x="0" y="32" font-family="'Montserrat', sans-serif" font-weight="600" font-size="12" fill="#4b5563">Student signature</text>
  </g>

  <!-- Validation Pill & QR Code -->
  <g transform="translate(600, 762)">
    <rect width="320" height="42" rx="21" fill="none" stroke="#0d5f47" stroke-width="1.5" />
    <text x="20" y="18" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#1f2937" letter-spacing="1">VALIDATION CODE:</text>
    <text x="20" y="33" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#0d5f47">529cb5f86a5eb8272e500983a1034fe2</text>
  </g>

  <!-- QR Code Mockup -->
  <g transform="translate(950, 680)">
    <rect width="130" height="130" rx="16" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2" />
    <rect x="965" y="695" width="30" height="30" fill="#111827" />
    <rect x="972" y="702" width="16" height="16" fill="#ffffff" />
    <rect x="976" y="706" width="8" height="8" fill="#111827" />

    <rect x="1035" y="695" width="30" height="30" fill="#111827" />
    <rect x="1042" y="702" width="16" height="16" fill="#ffffff" />
    <rect x="1046" y="706" width="8" height="8" fill="#111827" />

    <rect x="965" y="765" width="30" height="30" fill="#111827" />
    <rect x="972" y="772" width="16" height="16" fill="#ffffff" />
    <rect x="976" y="776" width="8" height="8" fill="#111827" />

    <!-- QR Data Matrix Bits -->
    <rect x="1010" y="700" width="12" height="12" fill="#111827" />
    <rect x="1015" y="720" width="18" height="8" fill="#111827" />
    <rect x="1005" y="740" width="14" height="14" fill="#111827" />
    <rect x="1030" y="750" width="12" height="20" fill="#111827" />
    <rect x="1050" y="760" width="15" height="15" fill="#111827" />
  </g>

  <!-- Legal Notice Footer -->
  <text x="250" y="805" font-family="'Montserrat', sans-serif" font-size="10" fill="#6b7280">This certificate proves the completion of the courses described herein on the Cursa platform.</text>
  <text x="250" y="820" font-family="'Montserrat', sans-serif" font-size="10" fill="#6b7280">Responsible party: Medeiros Tecnologia LTDA. CNPJ 24.471.978/0001-08 | contato@cursa.app</text>
